name: Container Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tunnel-preview:local .
      - run: >
          docker run -d --name tunnel-preview-smoke -p 5500:5500
          -v "$PWD:/workspace:ro" tunnel-preview:local
          --host 0.0.0.0 --port 5500
      - run: |
          for attempt in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:5500/healthz && exit 0
            sleep 1
          done
          exit 1
      - run: curl -fsS http://127.0.0.1:5500/
      - if: always()
        run: docker rm -f tunnel-preview-smoke
