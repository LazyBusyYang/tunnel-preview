[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tunnel-preview"
version = "0.1.0"
description = "A restricted file preview server for remote development tunnels."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
tunnel-preview = "tunnel_preview.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tunnel_preview"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
